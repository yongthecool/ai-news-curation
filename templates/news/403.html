{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접근 제한 (403 Forbidden) - AI News Curator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Background Glows -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-red-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative z-10 max-w-md w-full bg-slate-900/90 border border-red-500/30 backdrop-blur-xl rounded-2xl p-8 shadow-2xl text-center">
    <!-- Shield / Warning Icon -->
    <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-400 shadow-lg shadow-red-500/20">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
    </div>

    <span class="inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider bg-red-500/20 text-red-300 border border-red-500/30 uppercase mb-3">
      403 ACCESS DENIED
    </span>

    <h1 class="text-2xl font-black text-white mb-2">
      관리자 권한이 필요합니다
    </h1>
    
    <p class="text-slate-400 text-sm leading-relaxed mb-6">
      해당 페이지는 <span class="text-indigo-400 font-semibold">스태프(is_staff=True)</span> 권한을 가진 관리자만 접근할 수 있습니다.<br>
      현재 로그인된 계정: <span class="text-slate-200 font-bold">{{ request.user.username }}</span> (일반 유저)
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{% url 'news:index' %}" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition-all hover:-translate-y-0.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        메인으로 돌아가기
      </a>
      <a href="{% url 'news:logout' %}" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-semibold text-sm border border-slate-700 transition-all">
        다른 계정으로 로그인
      </a>
    </div>
  </div>

</body>
</html>
