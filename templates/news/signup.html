{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - AI News Curator</title>
  <meta name="description" content="AI 뉴스 큐레이터 회원가입">

  <!-- Fonts: Pretendard & Plus Jakarta Sans -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0a0d18;
      --bg-surface: #10162a;
      --bg-card: rgba(16, 22, 42, 0.88);
      --bg-input: #080b15;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-accent: rgba(99, 102, 241, 0.4);
      --border-focus: #6366f1;

      --text-pure: #ffffff;
      --text-head: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --accent-indigo: #6366f1;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;

      --gradient-main: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --shadow-lg: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
      --shadow-glow: 0 0 35px rgba(99, 102, 241, 0.3);

      --font-family: 'Pretendard', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 50%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-main);
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .brand-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--gradient-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
      margin-bottom: 1.25rem;
    }

    .auth-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-head);
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .gradient-text {
      background: var(--gradient-main);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Alert */
    .auth-alert {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 0.85rem 1.15rem;
      color: #fca5a5;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      line-height: 1.5;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.35rem;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 0.55rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1.1rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      pointer-events: none;
      transition: color 0.2s;
    }

    .auth-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.95rem 1.15rem 0.95rem 2.85rem;
      font-family: inherit;
      font-size: 0.98rem;
      color: var(--text-pure);
      transition: all 0.25s ease;
      outline: none;
    }

    .auth-input::placeholder {
      color: rgba(148, 163, 184, 0.45);
    }

    .auth-input:focus {
      border-color: var(--border-focus);
      background: rgba(8, 11, 21, 0.9);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .input-help {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 0.4rem;
      line-height: 1.4;
    }

    /* Submit Button */
    .auth-submit-btn {
      width: 100%;
      background: var(--gradient-main);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
      transition: all 0.25s ease;
      margin-top: 2rem;
    }

    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.55);
    }

    /* Footer Switch Link */
    .auth-footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .auth-link {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 700;
      margin-left: 0.35rem;
      transition: color 0.2s;
    }

    .auth-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Brand & Header -->
      <div class="brand-header">
        <div class="brand-icon-box">✨</div>
        <h1 class="auth-title">
          <span class="gradient-text">계정 생성</span>
        </h1>
        <p class="auth-subtitle">
          나만의 맞춤 뉴스 큐레이션 및 요약 히스토리를 시작하세요.
        </p>
      </div>

      <!-- Error Alert -->
      {% if error %}
      <div class="auth-alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="min-width: 18px; margin-top: 2px;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Signup Form -->
      <form method="POST" action="{% url 'news:signup' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username" class="form-label">아이디</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              name="username" 
              id="id_username" 
              class="auth-input" 
              placeholder="사용하실 영문/숫자 아이디 입력" 
              required 
              autofocus
              autocomplete="username"
            >
          </div>
          <p class="input-help">영문, 숫자 및 @/./+/-/_ 만 사용 가능합니다 (150자 이하).</p>
        </div>

        <div class="form-group">
          <label for="id_password1" class="form-label">비밀번호</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              name="password1" 
              id="id_password1" 
              class="auth-input" 
              placeholder="8자 이상의 안전한 비밀번호 입력" 
              required
              autocomplete="new-password"
            >
          </div>
          <p class="input-help">비밀번호는 최소 8자 이상이어야 하며 영문/숫자 조합을 권장합니다.</p>
        </div>

        <div class="form-group">
          <label for="id_password2" class="form-label">비밀번호 확인</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
            <input 
              type="password" 
              name="password2" 
              id="id_password2" 
              class="auth-input" 
              placeholder="비밀번호를 한 번 더 입력하세요" 
              required
              autocomplete="new-password"
            >
          </div>
        </div>

        <button type="submit" class="auth-submit-btn">
          <span>회원가입 완료 & 시작하기</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <!-- Footer Switch Link -->
      <div class="auth-footer">
        <span>이미 계정이 있으신가요?</span>
        <a href="{% url 'news:login' %}" class="auth-link">로그인하기</a>
      </div>

    </div>
  </div>

</body>
</html>
